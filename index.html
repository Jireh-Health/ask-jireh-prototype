  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
  <script>
    // Surface any error to the page so it's visible without opening DevTools.
    window.addEventListener('error', (e) => {
      const root = document.getElementById('root');
      if (!root) return;
      root.innerHTML = `
        <div style="padding:24px;font-family:monospace;background:#fff1f2;color:#881337;border:1px solid #fecdd3;margin:24px;border-radius:8px;">
          <div style="font-weight:bold;margin-bottom:8px;">Prototype error</div>
          <div style="white-space:pre-wrap;">${(e.error && e.error.stack) || e.message}</div>
        </div>`;
    });
  </script>

    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes pulseDot { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    .typing-dot { animation: pulseDot 1.1s ease-in-out infinite; }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    .pulse-ring::before { content: ''; position: absolute; inset: 0; border-radius: 9999px; background: currentColor; animation: pulseRing 1.6s ease-out infinite; }
    @keyframes softPop { 0% { transform: scale(0.9); opacity: 0; } 60% { transform: scale(1.05); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    /** Pick a string that may be a plain string or a {EN, SW} object. */
    const t = (val, lang) => {
      if (val == null) return '';
      if (typeof val === 'string') return val;
      return val[lang] ?? val.EN ?? '';
    };

    /** Render **bold** and line breaks in a plain string. */
    const renderRich = (str) => {
      if (!str) return null;
      return str.split('\n').map((line, i) => (
        <React.Fragment key={i}>
          {i > 0 && <br />}
          {line.split(/(\*\*[^*]+\*\*)/g).map((chunk, j) =>
            chunk.startsWith('**') && chunk.endsWith('**')
              ? <span key={j} className="font-semibold text-gray-900">{chunk.slice(2, -2)}</span>
              : <span key={j}>{chunk}</span>
          )}
        </React.Fragment>
      ));
    };

    // ═══════════════════════════════════════════════════════════════════════

    const ChatPanel = ({ activeJob, activeScenario, nudgeScenario, lang, setLang, onBack, onSelectJob, resetKey, chatOpen, onOpenChat, onCloseChat, onNudgeDismiss, onNudgeOpen, nudgeVisible }) => {
      const [visible, setVisible] = useState([]);
      const [isTyping, setIsTyping] = useState(false);
      const scrollRef = useRef(null);
      const strings = CONFIG.strings[lang];

      // Scenario chat overrides job chat; otherwise fall back to job script.
      const script = activeScenario
        ? activeScenario.chatScript
        : activeJob && !activeJob.stub
        ? CONFIG.scripts[activeJob.id]
        : null;

      // Reset visible messages when the job/scenario or reset key changes
      useEffect(() => {
        setVisible([]);
        setIsTyping(false);
        if (activeScenario) {
          playStep(0, []);
          return;
        }
        if (!activeJob) return;

        if (activeJob.stub) {
          // Stub jobs: one AI message + terminal
          const timer = setTimeout(() => {
            setVisible([
              { role: 'ai', text: `Here's how **${t(activeJob.title, lang)}** would work - this branch would continue in the full product.` },
            ]);
          }, 300);
          return () => clearTimeout(timer);
        }

        // Wired jobs: play the first step
        playStep(0, []);
      }, [activeJob?.id, activeScenario?.id, resetKey]);

      const playStep = (i, current) => {
        if (!script || i >= script.length) return;
        const s = script[i];

        // User steps: append immediately then advance
        if (s.role === 'user') {
          const next = [...current, { ...s, key: i }];
          setVisible(next);
          setTimeout(() => playStep(i + 1, next), 500);
          return;
        }

        // AI-chips: append; wait for user tap
        if (s.role === 'ai-chips') {
          const next = [...current, { ...s, key: i, stepIndex: i }];
          setVisible(next);
          return;
        }

        // Cards & AI bubbles: show typing then reveal
        setIsTyping(true);
        const delay = s.simulateDelay ?? 700;
        setTimeout(() => {
          setIsTyping(false);
          const next = [...current, { ...s, key: i, stepIndex: i }];
          setVisible(next);
          if (s.role !== 'card') {
            setTimeout(() => playStep(i + 1, next), 400);
          }
        }, delay);
      };

      const handleChip = (chip, fromStepIndex) => {
        if (chip.next === 'terminal') {
          const next = [
            ...visible.filter((m) => m.role !== 'ai-chips' || m.stepIndex !== fromStepIndex),
            { role: 'user', text: t(chip.label, lang), key: `chip-${Date.now()}` },
            { role: 'ai', text: strings.stubTerminal, key: `terminal-${Date.now()}` },
          ];
          setVisible(next);
          return;
        }
        if (chip.next === 'restart') {
          onBack();
          return;
        }
        if (chip.next === 'amount-input') {
          const stripped = visible.filter((m) => m.role !== 'ai-chips' || m.stepIndex !== fromStepIndex);
          setVisible([
            ...stripped,
            { role: 'amount-input', key: `amt-${Date.now()}`, hint: t(chip.hint, lang) },
          ]);
          return;
        }
        // Numeric next: jump to that step
        const stripped = visible.filter((m) => m.role !== 'ai-chips' || m.stepIndex !== fromStepIndex);
        playStep(chip.next, stripped);
      };

      const handleAmountSubmit = (amount) => {
        const formatted = amount.toLocaleString();
        const acceptedCopy = lang === 'EN'
          ? `Got it - **KES ${formatted}**. In the full product I'd carry this amount through to the confirmation card.`
          : `Nimeelewa - **KES ${formatted}**. Katika bidhaa kamili ningebeba kiasi hiki hadi kwenye kadi ya uthibitisho.`;
        setVisible([
          ...visible.filter((m) => m.role !== 'amount-input'),
          { role: 'user', text: `KES ${formatted}`, key: `amt-user-${Date.now()}` },
          { role: 'ai', text: acceptedCopy, key: `amt-ai-${Date.now()}` },
          {
            role: 'ai-chips',
            chips: [{ label: { EN: 'Back to home', SW: 'Rudi nyumbani' }, next: 'restart' }],
            stepIndex: `amt-back-${Date.now()}`,
            key: `amt-chips-${Date.now()}`,
          },
        ]);
      };

      const handleConfirm = (fromStepIndex) => {
        playStep(fromStepIndex + 1, visible);
      };

      const handleEdit = () => {
        // In prototype: no-op with a tiny visual nudge would be nice, but keep simple
      };

      // Auto-scroll to bottom on new message
      useEffect(() => {
        const el = scrollRef.current;
        if (el) el.scrollTop = el.scrollHeight;
      }, [visible, isTyping]);

      // Show saved-context chip once the user turn with savedContext:true appears
      const showSavedContext = visible.some((m) => m.savedContext);

      // Chat closed: show patient dashboard + FAB + active nudge (if any)
      if (!chatOpen) {
        return (
          <PhoneFrame>
            <StatusBar />
            <PatientDashboard
              lang={lang}
              onOpenChat={onOpenChat}
              onSelectJob={onSelectJob}
              activeScenario={nudgeScenario}
              nudgeVisible={nudgeVisible}
              onNudgeDismiss={onNudgeDismiss}
              onNudgeOpen={onNudgeOpen}
            />
          </PhoneFrame>
        );
      }

      // Chat open, no job/scenario selected: show welcome screen with close X
      if (!activeJob && !activeScenario) {
        return (
          <PhoneFrame>
            <StatusBar />
            <WelcomeScreen
              lang={lang}
              setLang={setLang}
              onSelectJob={onSelectJob}
              onCloseChat={onCloseChat}
            />
          </PhoneFrame>
        );
      }

      return (
        <PhoneFrame>
          <StatusBar />

          {/* Chat header */}
          <div className="flex items-center justify-between px-4 py-2 border-b border-gray-100">
            <button onClick={onBack} className="text-gray-600 p-1 -ml-1"><ChevronLeft /></button>
            <div className="flex items-center gap-1.5">
              <JirehBurst size={16} />
              <span className="flex items-baseline">
                <span className="text-sm font-light" style={{ color: CONFIG.brand.colorText }}>{CONFIG.brand.name}</span>
                <span className="text-sm font-bold" style={{ color: CONFIG.brand.color }}>{CONFIG.brand.suffix}</span>
              </span>
            </div>
            <div className="w-8" aria-hidden />
          </div>

          {/* Entry line - shows why the chat opened (scenario-driven only) */}
          {activeScenario && (
            <div
              className="mx-4 mt-2.5 px-3 py-1.5 rounded-lg text-[11px] fade-in flex items-start gap-1.5 flex-shrink-0"
              style={{ background: CONFIG.brand.colorSoft, color: CONFIG.brand.colorText }}
            >
              <Sparkle size={11} />
              <span className="flex-1">{activeScenario.entryLine}</span>
            </div>
          )}

          {/* Messages */}
          <div ref={scrollRef} className="flex-1 overflow-y-auto no-scrollbar px-4 py-3 space-y-3">
            {showSavedContext && <SavedContextChip lang={lang} />}
            {visible.map((m, i) => {
              if (m.role === 'user') return <UserBubble key={i} text={m.text} />;
              if (m.role === 'ai') return <AIBubble key={i} {...m} lang={lang} />;
              if (m.role === 'ai-chips') return (
                <ChipRow
                  key={i}
                  chips={m.chips}
                  lang={lang}
                  onTap={(c) => handleChip(c, m.stepIndex)}
                />
              );
              if (m.role === 'card') return (
                <ConfirmationCard
                  key={i}
                  card={m.card}
                  lang={lang}
                  onConfirm={() => handleConfirm(m.stepIndex)}
                  onEdit={handleEdit}
                />
              );
              if (m.role === 'hospitals') return (
                <HospitalList key={i} hospitals={m.hospitals} lang={lang} />
              );
              if (m.role === 'amount-input') return (
                <AmountInput key={i} hint={m.hint} onSubmit={handleAmountSubmit} />
              );
              return null;
            })}
            {isTyping && <TypingBubble />}
          </div>

          {/* Input */}
          <div className="border-t border-gray-100 px-3 py-2.5">
            <div className="flex items-center gap-2 bg-gray-50 rounded-full px-4 py-2">
              <input
                placeholder={strings.messagePlaceholder}
                className="flex-1 bg-transparent text-sm outline-none placeholder-gray-400"
                readOnly
              />
              <button
                className="w-7 h-7 rounded-full flex items-center justify-center"
                style={{ background: CONFIG.brand.color }}
              ><SendIcon /></button>
            </div>
            <div className="text-[10px] text-gray-400 text-center mt-1.5">{strings.typeHint}</div>
          </div>
        </PhoneFrame>
      );
    };

    // ═══════════════════════════════════════════════════════════════════════
    // Right panel: job list
    // ═══════════════════════════════════════════════════════════════════════

    const JobList = ({ lang, activeJobId, onSelectJob, onBack }) => {
      const strings = CONFIG.strings[lang];
      return (
        <div className="w-[380px] flex flex-col">
          <h2 className="text-2xl font-bold text-gray-900 mb-2">{strings.tryAFlow}</h2>
          <p className="text-sm text-gray-600 mb-5 leading-relaxed">{strings.tryAFlowSubtitle}</p>

          <div className="space-y-2 flex-1">
            {CONFIG.jobs.map((job) => {
              const active = job.id === activeJobId;
              return (
                <button
                  key={job.id}
                  onClick={() => onSelectJob(job)}
                  className={`w-full text-left rounded-2xl px-3 py-3 flex items-center gap-3 border transition ${
                    active
                      ? 'shadow-sm'
                      : 'border-gray-200 hover:border-purple-200 hover:bg-white'
                  }`}
                  style={active ? {
                    background: CONFIG.brand.colorSoft,
                    borderColor: CONFIG.brand.color,
                  } : {}}
                >
                  <div
                    className="w-8 h-8 rounded-lg flex items-center justify-center text-sm font-bold flex-shrink-0"
                    style={{
                      background: active ? CONFIG.brand.color : '#F3F4F6',
                      color: active ? 'white' : '#374151',
                    }}
                  >
                    {job.number}
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-semibold text-sm text-gray-900">{t(job.title, lang)}</div>
                    <div className="text-xs text-gray-500">{t(job.subtitle, lang)}</div>
                  </div>
                </button>
              );
            })}
          </div>

          <button
            onClick={onBack}
            className="mt-4 flex items-center justify-center gap-2 rounded-full py-2.5 text-sm font-medium text-gray-700 border border-gray-200 hover:bg-white transition"
          >
            <RefreshIcon />
            {strings.backToWelcome}
          </button>

          <div className="flex items-start gap-2 mt-4 text-xs text-gray-500 leading-relaxed">
            <span className="text-emerald-600 mt-0.5"><InfoIcon /></span>
            <span>{strings.footerPrinciple}</span>
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════════════════════════════════
    // App
    // ═══════════════════════════════════════════════════════════════════════

    function App() {
      const [lang, setLang] = useState(CONFIG.strings.EN ? 'EN' : 'SW');
      const [activeJob, setActiveJob] = useState(null);
      const [chatOpen, setChatOpen] = useState(false);
      const [resetKey, setResetKey] = useState(0);

      // v3 additions - proactive nudge state
      const [currentScenarioId, setCurrentScenarioId] = useState(SCENARIOS[0].id);
      const [nudgeVisible, setNudgeVisible] = useState(false);
      const [activeScenario, setActiveScenario] = useState(null);

      const currentScenario = SCENARIOS.find((s) => s.id === currentScenarioId);

      // Runs a scenario from scratch: resets state, then either opens welcome
      // (user-initiated) or fires the nudge after a short delay.
      const runScenario = (id) => {
        const scenario = SCENARIOS.find((s) => s.id === id);
        setCurrentScenarioId(id);
        setActiveJob(null);
        setActiveScenario(null);
        setNudgeVisible(false);
        setChatOpen(false);
        const isWelcome = scenario?.special === 'welcome';
        setTimeout(() => {
          if (isWelcome) {
            setChatOpen(true);
          } else {
            setNudgeVisible(true);
          }
        }, isWelcome ? 120 : 1400);
      };

      // Run whichever scenario is selected on mount
      useEffect(() => {
        runScenario(currentScenarioId);
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, []);

      const openChat = () => {
        // User tapped FAB - open welcome screen (no scenario, no job)
        setChatOpen(true);
        setActiveJob(null);
        setActiveScenario(null);
        setNudgeVisible(false);
      };

      const closeChat = () => {
        setChatOpen(false);
        setActiveJob(null);
        setActiveScenario(null);
      };

      const handleSelectJob = (job) => {
        setChatOpen(true);
        setActiveScenario(null);
        if (activeJob?.id === job.id) {
          setResetKey((k) => k + 1);
        } else {
          setActiveJob(job);
          setResetKey((k) => k + 1);
        }
      };

      const handleBack = () => {
        // In a scenario chat → back closes chat entirely (no welcome for scenarios)
        // In a job chat → back to welcome
        if (activeScenario) {
          closeChat();
          return;
        }
        setActiveJob(null);
      };

      const handleNudgeDismiss = () => {
        setNudgeVisible(false);
      };

      const handleNudgeOpen = () => {
        setActiveScenario(currentScenario);
        setActiveJob(null);
        setChatOpen(true);
        setResetKey((k) => k + 1);
        setNudgeVisible(false);
      };

      const replayCurrentScenario = () => runScenario(currentScenarioId);

      // Group scenarios by section for the sidebar
      const scenarioSections = SCENARIOS.reduce((acc, sc) => {
        (acc[sc.section] = acc[sc.section] || []).push(sc);
        return acc;
      }, {});

      return (
        <div className="min-h-screen py-8 px-6">
          <div className="max-w-6xl mx-auto">
            <div className="grid grid-cols-1 lg:grid-cols-[auto_1fr] gap-12 items-start justify-center lg:justify-start">
              <ChatPanel
                activeJob={activeJob}
                activeScenario={activeScenario}
                nudgeScenario={currentScenario}
                lang={lang}
                setLang={setLang}
                onBack={handleBack}
                onSelectJob={handleSelectJob}
                resetKey={resetKey}
                chatOpen={chatOpen}
                onOpenChat={openChat}
                onCloseChat={closeChat}
                nudgeVisible={nudgeVisible && !chatOpen}
                onNudgeDismiss={handleNudgeDismiss}
                onNudgeOpen={handleNudgeOpen}
              />

              {/* Demo controls sidebar (replaces the old "Try a flow" JobList) */}
              <div className="w-[380px] flex flex-col">
                <h2 className="text-2xl font-bold text-gray-900 mb-2">Demo controls</h2>
                <p className="text-sm text-gray-600 mb-5 leading-relaxed">
                  Pick a proactive nudge scenario. Wait ~1.4 s for it to appear on the phone, then tap it to run the chat flow - or tap the <strong>Ask Jireh</strong> FAB to open the assistant on your own (Welcome screen with 8 jobs).
                </p>

                <div className="space-y-4 flex-1">
                  {Object.keys(scenarioSections).map((sectionName) => (
                    <div key={sectionName}>
                      <div className="text-[10px] font-bold uppercase tracking-wider text-gray-500 mb-1.5 px-1">
                        {sectionName}
                      </div>
                      <div className="space-y-1.5">
                        {scenarioSections[sectionName].map((sc, idx) => {
                          const globalIdx = SCENARIOS.findIndex((s) => s.id === sc.id);
                          const active = sc.id === currentScenarioId;
                          const isWelcome = sc.special === 'welcome';
                          return (
                            <button
                              key={sc.id}
                              onClick={() => runScenario(sc.id)}
                              className={`w-full text-left rounded-2xl px-3 py-2.5 flex items-center gap-3 border transition ${
                                active ? 'shadow-sm' : 'border-gray-200 hover:border-purple-200 hover:bg-white'
                              }`}
                              style={active ? {
                                background: CONFIG.brand.colorSoft,
                                borderColor: CONFIG.brand.color,
                              } : {}}
                            >
                              <div
                                className="w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold flex-shrink-0"
                                style={{
                                  background: active ? CONFIG.brand.color : '#F3F4F6',
                                  color: active ? 'white' : '#374151',
                                }}
                              >
                                {globalIdx + 1}
                              </div>
                              <div className="flex-1 min-w-0">
                                <div className="font-semibold text-sm text-gray-900 leading-tight">
                                  {sc.title}
                                </div>
                                <div className="text-[10px] text-gray-500 mt-0.5">
                                  {isWelcome ? (
                                    <span className="italic">No trigger - Welcome screen with 8 jobs</span>
                                  ) : (
                                    <>
                                      Pattern: <span className="font-medium text-gray-700">
                                        {sc.visualPattern === 'A' && 'Speech bubble'}
                                        {sc.visualPattern === 'B' && 'Inline card'}
                                        {sc.visualPattern === 'C' && 'Top banner'}
                                        {sc.visualPattern === 'D' && 'FAB pulse'}
                                      </span>
                                    </>
                                  )}
                                </div>
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                <button
                  onClick={replayCurrentScenario}
                  className="mt-4 flex items-center justify-center gap-2 rounded-full py-2.5 text-sm font-medium text-gray-700 border border-gray-200 hover:bg-white transition"
                >
                  <RefreshIcon />
                  Replay current scenario
                </button>

                <div className="flex items-start gap-2 mt-4 text-xs text-gray-500 leading-relaxed">
                  <span className="text-emerald-600 mt-0.5"><InfoIcon /></span>
                  <span>
                    Tapping the <strong>FAB</strong> always opens the Welcome screen (8 jobs), regardless of which nudge is showing. The nudge and the FAB are two independent ways to reach the assistant.
                  </span>
                </div>
              </div>
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
